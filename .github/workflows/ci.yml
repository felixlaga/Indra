name: CI

# Runs on every pull request and every push to main, with no path filters,
# so a change anywhere cannot skip the checks.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: API imports and registers its core routes
        run: >-
          uv run python -c "from src.api import create_app;
          paths = {route.path for route in create_app().routes};
          missing = {'/projects', '/sessions', '/sessions/{session_id}/state'} - paths;
          assert not missing, f'missing routes: {missing}'"
      - name: Run the full test suite
        run: uv run pytest -q
