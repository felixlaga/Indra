[project]
name = "indra"
version = "0.1.0"
description = "Epistemic research landscape agent for recursive literature exploration, source-grounded summarization, and research navigation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "openai>=1.0",  # OpenRouter uses OpenAI-compatible API
    "lettucedetect>=0.1.8",  # Token-level hallucination detection
    "transformers>=4.40",  # NLI model
    "torch>=2.0",  # PyTorch backend
    "pyyaml>=6.0",  # YAML config loading
    "fastapi>=0.115",  # HTTP server for HaluGate and future product API
    "uvicorn>=0.34",  # ASGI server
    "arxiv>=2.1",  # arXiv API wrapper
    "typer>=0.9",  # CLI framework
    "psycopg[binary,pool]>=3.2",  # Postgres durable repository and bounded connections
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
indra = "src.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Linux installs (containers, CI) use CPU-only PyTorch instead of the multi-gigabyte
# CUDA build; macOS and Windows resolve from PyPI as before.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
